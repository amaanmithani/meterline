name: CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with: { version: latest }

  test:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: start Redpanda, ClickHouse, stripe-mock
        run: |
          docker compose up -d
          for i in $(seq 60); do curl -sf localhost:18123/ping && break; sleep 1; done
      - run: go test -p 1 -race -covermode=atomic -coverpkg=./internal/...,./cmd/... -coverprofile=coverage.out ./...
        env:
          MET_KAFKA: localhost:19092
          MET_CLICKHOUSE: localhost:19000
          MET_STRIPE: http://localhost:12111
      - name: coverage gate
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "total coverage: ${total}%"
          echo "COVERAGE_MIN=${COVERAGE_MIN}"
          awk -v t="$total" -v m="${COVERAGE_MIN}" 'BEGIN { exit (t+0 < m+0) }'
        env:
          COVERAGE_MIN: '85'

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go build ./...
