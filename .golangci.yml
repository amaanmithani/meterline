version: "2"
linters:
  settings:
    errcheck:
      # Close-on-read-path and writes to an http.ResponseWriter have no useful
      # recovery; failures surface through the next read/flush instead.
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - fmt.Fprint
        - (github.com/ClickHouse/clickhouse-go/v2/lib/driver.Rows).Close
        - (*github.com/amaanmithani/meterline/internal/store.Store).Close
        - (net.Listener).Close
        - fmt.Fprintf
